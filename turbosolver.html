<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Planarity Turbo Solver</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      font-family: sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .controls {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px;
      background: #333;
      border-radius: 5px;
    }
    .controls label { margin-right: 14px; }
    .controls input[type="number"] { width: 65px; }
    .controls button {
      padding: 7px 14px;
      margin-right: 8px;
      cursor: pointer;
    }
    #status {
      display: block;
      margin-top: 8px;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(180px, 1fr));
      gap: 7px;
      margin-top: 10px;
    }
    .puzzle {
      overflow: hidden;
      background: #fff;
      border-radius: 4px;
    }
    .puzzle-header {
      display: flex;
      justify-content: space-between;
      padding: 4px 6px;
      background: #333;
      color: #fff;
      font-size: 10px;
    }
    .puzzle-header button {
      padding: 0 3px;
      margin-left: 4px;
      border: 1px solid #aaa;
      background: #555;
      color: #fff;
      cursor: pointer;
      font-size: 9px;
    }
    .puzzle.solved .puzzle-header { background: #075f18; }
    .puzzle.capped .puzzle-header { background: #765400; }
    .puzzle.stuck .puzzle-header { background: #700; }
    .puzzle.churned .puzzle-header { background: #65356f; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
    }
  </style>
</head>
<body>
  <div class="controls">
    <label>Vertices: <input id="num-nodes" type="number" value="30" min="10" max="200"></label>
    <label>Graphs: <input id="num-graphs" type="number" value="50" min="1" max="200"></label>
    <label>Seed: <input id="seed" type="number" value="12345" min="1" max="4294967295"></label>
    <label>Move cap: <input id="move-cap" type="number" value="400" min="1" max="5000"></label>
    <label>Churn patience: <input id="churn-patience" type="number" value="75" min="10" max="1000"></label>
    <label>Moves/frame: <input id="moves-frame" type="number" value="10" min="1" max="100"></label>
    <label>Frame delay: <input id="frame-delay" type="number" value="30" min="0" max="1000"> ms</label>
    <button id="new-btn">New Batch</button>
    <button id="run-btn">Run</button>
    <button id="export-btn">Export Results</button>
    <span id="status"></span>
  </div>
  <div id="grid" class="grid"></div>

  <script src="solver.js"></script>
  <script>
    var Solver = window.Solver;
    var fs = null;
    if (typeof require !== 'undefined') {
      if (!Solver) {
        try { Solver = require('./solver.js'); } catch (error) {}
      }
      try { fs = require('fs'); } catch (error) {}
    }

    var puzzles = [];
    var running = false;
    var startedAt = null;
    var animationHandle = null;
    var activeSeed = 12345;

    function numberValue(id, fallback) {
      return parseInt(document.getElementById(id).value, 10) || fallback;
    }

    function seededRandom(seed) {
      var state = seed >>> 0;
      return function() {
        state = (state * 1664525 + 1013904223) >>> 0;
        return state / 0x100000000;
      };
    }

    function strategyCounts(history) {
      var counts = {};
      history.forEach(function(move) {
        counts[move.strategy] = (counts[move.strategy] || 0) + 1;
      });
      return counts;
    }

    function graphEdges(graph) {
      return graph.links.map(function(link) {
        return [
          graph.nodes.indexOf(link[0]),
          graph.nodes.indexOf(link[1])
        ];
      });
    }

    function graphPositions(graph) {
      return graph.nodes.map(function(node) {
        return [node[0], node[1]];
      });
    }

    function structuralMetrics(graph) {
      var analysis = Solver.analyzeGraphState(graph, {});
      return {
        crossings: analysis.crossings,
        cleanVertices: analysis.cleanVertices,
        largestCleanRegion: analysis.largestCleanRegion,
        conflictVertices: analysis.conflictRegions.length > 0
          ? analysis.conflictRegions[0].vertexCount : 0,
        establishedScore: analysis.bestEstablishedRegion
          ? analysis.bestEstablishedRegion.score : 0
      };
    }

    function compareMetrics(candidate, best) {
      if (candidate.crossings !== best.crossings) {
        return best.crossings - candidate.crossings;
      }
      if (candidate.largestCleanRegion !== best.largestCleanRegion) {
        return candidate.largestCleanRegion - best.largestCleanRegion;
      }
      if (candidate.conflictVertices !== best.conflictVertices) {
        return best.conflictVertices - candidate.conflictVertices;
      }
      if (candidate.cleanVertices !== best.cleanVertices) {
        return candidate.cleanVertices - best.cleanVertices;
      }
      return candidate.establishedScore - best.establishedScore;
    }

    function snapshot(puzzle, label, metrics) {
      return {
        move: puzzle.moves,
        label: label,
        positions: graphPositions(puzzle.graph),
        crossings: puzzle.crossings,
        strategy: puzzle.lastStrategy,
        movingNode: puzzle.history.length > 0
          ? puzzle.history[puzzle.history.length - 1].vertex : null,
        metrics: metrics
      };
    }

    function createPuzzle(id, nodeCount) {
      var container = document.createElement('div');
      container.className = 'puzzle';
      var header = document.createElement('div');
      header.className = 'puzzle-header';
      var canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 300;
      container.appendChild(header);
      container.appendChild(canvas);
      document.getElementById('grid').appendChild(container);

      var graph = Solver.scramble(Solver.planarGraph(nodeCount));
      var crossings = Solver.intersections(graph.links);
      var puzzle = {
        id: id,
        graph: graph,
        solverState: {},
        container: container,
        header: header,
        canvas: canvas,
        moves: 0,
        status: 'running',
        initialCrossings: crossings,
        crossings: crossings,
        maxCrossings: crossings,
        minCrossings: crossings,
        lastStrategy: '-',
        history: [],
        snapshots: [],
        bestSnapshot: null,
        progressMetrics: null,
        movesSinceStructuralProgress: 0
      };
      var metrics = structuralMetrics(graph);
      puzzle.bestSnapshot = snapshot(puzzle, 'initial', metrics);
      puzzle.progressMetrics = metrics;
      puzzle.snapshots.push(puzzle.bestSnapshot);
      return puzzle;
    }

    function createBatch() {
      stop();
      document.getElementById('grid').innerHTML = '';
      puzzles = [];
      startedAt = null;
      var nodeCount = numberValue('num-nodes', 30);
      var graphCount = numberValue('num-graphs', 50);
      activeSeed = numberValue('seed', 12345) >>> 0;
      Math.random = seededRandom(activeSeed);
      for (var i = 0; i < graphCount; i++) {
        puzzles.push(createPuzzle(i + 1, nodeCount));
      }
      renderAll();
      updateStatus();
    }

    function drawPuzzle(puzzle) {
      var canvas = puzzle.canvas;
      var context = canvas.getContext('2d');
      var width = canvas.width;
      var height = canvas.height;
      var graph = puzzle.graph;
      Solver.intersections(graph.links);

      context.clearRect(0, 0, width, height);
      context.fillStyle = '#fff';
      context.fillRect(0, 0, width, height);
      graph.links.forEach(function(link) {
        context.beginPath();
        context.moveTo(8 + link[0][0] * (width - 16), 8 + link[0][1] * (height - 16));
        context.lineTo(8 + link[1][0] * (width - 16), 8 + link[1][1] * (height - 16));
        context.strokeStyle = link.intersection ? '#111' : '#e6ae00';
        context.lineWidth = link.intersection ? 0.8 : 1.1;
        context.stroke();
      });
      graph.nodes.forEach(function(node) {
        context.beginPath();
        context.arc(
          8 + node[0] * (width - 16),
          8 + node[1] * (height - 16),
          2.4, 0, Math.PI * 2);
        context.fillStyle = node.intersection ? '#00a9d6' : '#ffc400';
        context.fill();
      });

      puzzle.container.className = 'puzzle ' + puzzle.status;
      puzzle.header.innerHTML =
        '<span>#' + puzzle.id + ' ' + puzzle.crossings + 'x</span>' +
        '<span>' + puzzle.moves + 'm ' + puzzle.lastStrategy +
          (puzzle.status === 'solved' ? '' :
            ' <button data-replay="' + puzzle.id + '">Replay best</button>') +
        '</span>';
      puzzle.container.title =
        'Initial: ' + puzzle.initialCrossings +
        '\nMin: ' + puzzle.minCrossings +
        '\nMax: ' + puzzle.maxCrossings +
        '\nStatus: ' + puzzle.status;
    }

    function renderAll() {
      puzzles.forEach(drawPuzzle);
    }

    function finishPuzzle(puzzle, status) {
      puzzle.status = status;
      puzzle.crossings = Solver.intersections(puzzle.graph.links);
    }

    function restoreBestSnapshot(puzzle) {
      if (!puzzle.bestSnapshot) return;
      puzzle.graph.nodes.forEach(function(node, index) {
        node[0] = puzzle.bestSnapshot.positions[index][0];
        node[1] = puzzle.bestSnapshot.positions[index][1];
      });
      puzzle.crossings = Solver.intersections(puzzle.graph.links);
      puzzle.lastStrategy = 'restored-best';
      puzzle.solverState = {};
    }

    function recordStructuralProgress(puzzle) {
      var metrics = structuralMetrics(puzzle.graph);
      var progress = puzzle.progressMetrics;
      var meaningfulProgress =
        metrics.crossings < progress.crossings ||
        metrics.cleanVertices >= progress.cleanVertices + 2 ||
        metrics.largestCleanRegion >= progress.largestCleanRegion + 2 ||
        metrics.conflictVertices <= progress.conflictVertices - 2 ||
        metrics.establishedScore >= progress.establishedScore + 2;
      if (compareMetrics(metrics, puzzle.bestSnapshot.metrics) > 0) {
        puzzle.bestSnapshot = snapshot(puzzle, 'structural-best', metrics);
        puzzle.snapshots.push(puzzle.bestSnapshot);
      }
      if (meaningfulProgress) {
        puzzle.progressMetrics = metrics;
        puzzle.movesSinceStructuralProgress = 0;
        return true;
      }
      puzzle.movesSinceStructuralProgress++;
      return false;
    }

    function stepPuzzle(puzzle, moveCap, churnPatience) {
      if (puzzle.status !== 'running') return;
      if (puzzle.moves >= moveCap) {
        finishPuzzle(puzzle, 'capped');
        return;
      }
      var result = Solver.solverStep(puzzle.graph, puzzle.solverState);
      puzzle.crossings = result.count === undefined
        ? Solver.intersections(puzzle.graph.links) : result.count;
      puzzle.minCrossings = Math.min(puzzle.minCrossings, puzzle.crossings);
      puzzle.maxCrossings = Math.max(puzzle.maxCrossings, puzzle.crossings);

      if (result.done || puzzle.crossings === 0) {
        finishPuzzle(puzzle, 'solved');
        return;
      }
      if (result.stuck) {
        finishPuzzle(puzzle, 'stuck');
        return;
      }
      if (result.move) {
        puzzle.moves++;
        puzzle.lastStrategy = result.move.strategy;
        puzzle.history.push({
          move: puzzle.moves,
          strategy: result.move.strategy,
          vertex: result.move.nodeIndex,
          crossings: puzzle.crossings,
          structuralPlan: result.move.search && result.move.search.structuralPlan || null
        });
        recordStructuralProgress(puzzle);
        // Once the graph reaches the diagnostically important late game,
        // retain every position. This preserves complete Stage 2/3 sequences,
        // including temporary crossing increases, without bloating early-game
        // batch logs.
        if (puzzle.minCrossings <= 20 &&
            puzzle.snapshots[puzzle.snapshots.length - 1].move !== puzzle.moves) {
          puzzle.snapshots.push(snapshot(
            puzzle, 'low-crossing-move', structuralMetrics(puzzle.graph)));
        }
      }
      if (puzzle.moves >= moveCap) {
        finishPuzzle(puzzle, 'capped');
      } else if (puzzle.movesSinceStructuralProgress >= churnPatience) {
        restoreBestSnapshot(puzzle);
        finishPuzzle(puzzle, 'churned');
      }
    }

    function updateStatus() {
      var counts = { running: 0, solved: 0, capped: 0, stuck: 0, churned: 0 };
      var moves = 0;
      puzzles.forEach(function(puzzle) {
        counts[puzzle.status]++;
        moves += puzzle.moves;
      });
      var elapsed = startedAt ? ((Date.now() - startedAt) / 1000).toFixed(1) : '0.0';
      document.getElementById('status').textContent =
        'Solved ' + counts.solved + '/' + puzzles.length +
        ' | Active ' + counts.running +
        ' | Capped ' + counts.capped +
        ' | Churned ' + counts.churned +
        ' | Stuck ' + counts.stuck +
        ' | Moves ' + moves +
        ' | Elapsed ' + elapsed + 's';
    }

    function tick() {
      if (!running) return;
      var movesPerFrame = numberValue('moves-frame', 10);
      var moveCap = numberValue('move-cap', 400);
      var churnPatience = numberValue('churn-patience', 75);
      for (var step = 0; step < movesPerFrame; step++) {
        puzzles.forEach(function(puzzle) {
          stepPuzzle(puzzle, moveCap, churnPatience);
        });
      }
      renderAll();
      updateStatus();

      var active = puzzles.some(function(puzzle) {
        return puzzle.status === 'running';
      });
      if (!active) {
        stop();
        exportResults(true);
        return;
      }
      animationHandle = setTimeout(tick, numberValue('frame-delay', 30));
    }

    function run() {
      if (running) {
        stop();
        return;
      }
      if (!puzzles.some(function(puzzle) { return puzzle.status === 'running'; })) {
        createBatch();
      }
      running = true;
      startedAt = startedAt || Date.now();
      document.getElementById('run-btn').textContent = 'Stop';
      tick();
    }

    function stop() {
      running = false;
      if (animationHandle) clearTimeout(animationHandle);
      animationHandle = null;
      document.getElementById('run-btn').textContent = 'Run';
      updateStatus();
    }

    function buildReport() {
      var solved = puzzles.filter(function(puzzle) {
        return puzzle.status === 'solved';
      });
      var capped = puzzles.filter(function(puzzle) {
        return puzzle.status === 'capped';
      });
      var stuck = puzzles.filter(function(puzzle) {
        return puzzle.status === 'stuck';
      });
      var churned = puzzles.filter(function(puzzle) {
        return puzzle.status === 'churned';
      });
      var totalMoves = puzzles.reduce(function(sum, puzzle) {
        return sum + puzzle.moves;
      }, 0);
      return {
        timestamp: new Date().toISOString(),
        config: {
          nodes: numberValue('num-nodes', 30),
          graphs: puzzles.length,
          seed: activeSeed,
          moveCap: numberValue('move-cap', 400),
          churnPatience: numberValue('churn-patience', 75),
          movesPerFrame: numberValue('moves-frame', 10),
          frameDelayMs: numberValue('frame-delay', 30)
        },
        elapsedMs: startedAt ? Date.now() - startedAt : 0,
        summary: {
          solved: solved.length,
          capped: capped.length,
          stuck: stuck.length,
          churned: churned.length,
          solveRate: puzzles.length > 0 ? solved.length / puzzles.length : 0,
          totalMoves: totalMoves,
          averageMovesPerSolve: solved.length > 0
            ? solved.reduce(function(sum, puzzle) {
              return sum + puzzle.moves;
            }, 0) / solved.length : null,
          longestSuccessfulSolve: solved.length > 0
            ? Math.max.apply(null, solved.map(function(puzzle) {
              return puzzle.moves;
            })) : null
        },
        puzzles: puzzles.map(function(puzzle) {
          return {
            id: puzzle.id,
            status: puzzle.status,
            moves: puzzle.moves,
            initialCrossings: puzzle.initialCrossings,
            finalCrossings: puzzle.crossings,
            minimumCrossings: puzzle.minCrossings,
            maximumCrossings: puzzle.maxCrossings,
            movesSinceStructuralProgress: puzzle.movesSinceStructuralProgress,
            edges: graphEdges(puzzle.graph),
            initialSnapshot: puzzle.snapshots[0],
            bestSnapshot: puzzle.bestSnapshot,
            finalSnapshot: snapshot(
              puzzle, 'final-' + puzzle.status,
              structuralMetrics(puzzle.graph)),
            snapshots: puzzle.snapshots,
            strategies: strategyCounts(puzzle.history),
            history: puzzle.history
          };
        })
      };
    }

    function exportResults(automatic) {
      var report = buildReport();
      var contents = JSON.stringify(report, null, 2);
      if (fs) {
        fs.writeFileSync('turbosolver-results.json', contents);
        if (!automatic) document.getElementById('status').textContent +=
          ' | Wrote turbosolver-results.json';
        return;
      }
      if (automatic) return;
      var blob = new Blob([contents], { type: 'application/json' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'turbosolver-results.json';
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function buildInteractiveReplay(puzzle) {
      var replaySnapshots = puzzle.snapshots.slice();
      replaySnapshots.push(snapshot(
        puzzle, 'final-' + puzzle.status,
        structuralMetrics(puzzle.graph)));
      return {
        schemaVersion: 2,
        timestamp: new Date().toISOString(),
        session: 'turbosolver-' + puzzle.id,
        nodes: puzzle.graph.nodes.map(function(node) {
          return [node[0], node[1]];
        }),
        edges: graphEdges(puzzle.graph),
        currentPosition: Math.max(0, replaySnapshots.length - 2),
        moves: puzzle.bestSnapshot ? puzzle.bestSnapshot.move : puzzle.moves,
        selectedVertex: -1,
        crossings: puzzle.bestSnapshot
          ? puzzle.bestSnapshot.crossings : puzzle.crossings,
        history: replaySnapshots.map(function(item) {
          return {
            positions: item.positions,
            crossings: item.crossings,
            strategy: item.strategy || item.label,
            movingNode: item.movingNode,
            move: {
              source: 'turbosolver',
              strategy: item.label,
              vertex: item.movingNode,
              number: item.move,
              rationale: { metrics: item.metrics }
            }
          };
        })
      };
    }

    function downloadReplay(puzzle) {
      var contents = JSON.stringify(buildInteractiveReplay(puzzle), null, 2);
      var filename = 'turbosolver-graph-' + puzzle.id + '-replay.json';
      if (fs) {
        fs.writeFileSync(filename, contents);
        document.getElementById('status').textContent += ' | Wrote ' + filename;
        return;
      }
      var blob = new Blob([contents], { type: 'application/json' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    document.getElementById('new-btn').addEventListener('click', createBatch);
    document.getElementById('run-btn').addEventListener('click', run);
    document.getElementById('export-btn').addEventListener('click', function() {
      exportResults(false);
    });
    document.getElementById('grid').addEventListener('click', function(event) {
      var id = event.target && event.target.getAttribute('data-replay');
      if (!id) return;
      event.stopPropagation();
      var puzzle = puzzles.filter(function(item) {
        return item.id === +id;
      })[0];
      if (puzzle) downloadReplay(puzzle);
    });
    createBatch();
  </script>
</body>
</html>
