<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Planarity Solver Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 10px;
      font-family: sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .controls {
      position: sticky;
      top: 0;
      z-index: 100;
      margin-bottom: 10px;
      padding: 10px;
      background: #333;
      border-radius: 5px;
    }
    .controls button {
      padding: 8px 16px;
      margin-right: 10px;
      cursor: pointer;
    }
    .controls label {
      margin-right: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .puzzle {
      background: #fff;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 4px solid #333;
      outline: 2px solid transparent;
    }
    .puzzle.selected {
      outline: 4px solid #66ccff;
    }
    .puzzle.solved {
      border-color: #00e060;
      outline-color: #00e060;
      box-shadow: 0 0 12px rgba(0, 224, 96, 0.85);
    }
    .puzzle.stuck {
      border-color: #ff3030;
      outline-color: #ff3030;
      box-shadow: 0 0 12px rgba(255, 48, 48, 0.85);
    }
    .puzzle svg {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    .puzzle-header {
      background: #333;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .puzzle-header .row {
      display: flex;
      justify-content: space-between;
    }
    .puzzle-header .metrics-row {
      font-size: 13px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #e6f0ff;
      letter-spacing: 0.3px;
    }
    .puzzle-header .metrics-row .sep {
      color: #6a7a90;
      margin: 0 6px;
    }
    .puzzle-header .metrics-row .k {
      color: #88a;
      margin-right: 3px;
    }
    .puzzle-header .metrics-row .v {
      color: #fff;
      font-weight: 600;
    }
    .puzzle-header.solved { background: #060; }
    .puzzle-header.stuck { background: #600; }
    .puzzle-actions {
      background: #222;
      display: flex;
      gap: 4px;
      padding: 4px;
    }
    .puzzle-actions button {
      flex: 1;
      font-size: 10px;
      padding: 3px 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="controls">
    <label>Nodes: <input type="number" id="num-nodes" value="30" min="10" max="100" style="width:50px"></label>
    <label>Speed: <input type="range" id="speed" min="1" max="100" value="70" style="width:100px"></label>
    <label><input type="checkbox" id="auto-add" checked> Auto-add replacements</label>
    <label><input type="checkbox" id="deterministic-clock"> Deterministic solver clock</label>
    <button id="start-btn">Start</button>
    <button id="add-btn">+6 More</button>
    <button id="reset-btn">Clear All</button>
    <button id="export-btn">Export All</button>
    <button id="export-replay-btn">Export Last Clicked Replay</button>
    <span id="status" style="margin-left: 20px;"></span>
  </div>
  <div class="grid" id="grid"></div>

  <script src="solver.js"></script>
  <script>
    // Import solver
    var Solver = window.Solver;
    var fs = null;
    if (typeof require !== 'undefined') {
      if (!Solver) {
        try { Solver = require('./solver.js'); } catch(e) {}
      }
      try { fs = require('fs'); } catch(e) {}
    }
    
    var intersections = Solver.intersections;
    var planarGraph = Solver.planarGraph;
    var scramble = Solver.scramble;
    var solverStepCore = Solver.solverStep;
    var analyzeGraphState = Solver.analyzeGraphState;
    var computeProgressMetrics = Solver.computeProgressMetrics;
    var createStoryState = Solver.createStoryState;
    var updateStoryMetrics = Solver.updateStoryMetrics;

    function applySolverClock(reset) {
      var checkbox = document.getElementById('deterministic-clock');
      if (!Solver.setDeterministicClock) return;
      Solver.setDeterministicClock(checkbox && checkbox.checked, {
        startMs: reset ? 0 : (Solver.getClockState ? Solver.getClockState().tick : 0),
        stepMs: 1
      });
    }
    
    var puzzles = [];
    var running = false;
    var stats = { solved: 0, stuck: 0, totalMoves: 0 };
    var lastClickedPuzzle = null;

    function graphPositions(graph) {
      return graph.nodes.map(function(node) {
        return [node[0], node[1]];
      });
    }

    function graphEdges(graph) {
      return graph.links.map(function(link) {
        return [
          graph.nodes.indexOf(link[0]),
          graph.nodes.indexOf(link[1])
        ];
      });
    }

    function strategyCounts(history) {
      var strats = {};
      history.forEach(function(h) {
        var strategy = h.strategy || h.src || '-';
        strats[strategy] = (strats[strategy] || 0) + 1;
      });
      return strats;
    }

    function snapshotPuzzle(puzzle, label, result) {
      return {
        moveNumber: puzzle.moves,
        label: label,
        positions: graphPositions(puzzle.graph),
        crossings: puzzle.count,
        strategy: puzzle.lastStrategy,
        movingNode: result && result.move ? result.move.nodeIndex : null,
        moveRecord: result && result.move ? {
          source: 'solver',
          strategy: result.move.strategy,
          vertex: result.move.nodeIndex,
          number: puzzle.moves,
          from: [result.move.fromX, result.move.fromY],
          to: [result.move.toX, result.move.toY],
          crossingsAfter: puzzle.count,
          improvement: result.move.improvement,
          rationale: result.move.search || null
        } : null
      };
    }

    function downloadJson(filename, payload, automatic) {
      var contents = JSON.stringify(payload, null, 2);
      if (fs) {
        fs.writeFileSync(filename, contents);
        if (!automatic) {
          document.getElementById('status').textContent += ' | Wrote ' + filename;
        }
        return;
      }
      if (automatic) return;
      var blob = new Blob([contents], { type: 'application/json' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function selectPuzzle(puzzle) {
      lastClickedPuzzle = puzzle;
      window.lastPuzzleHistory = puzzle.history;
      window.lastPuzzle = puzzle;
      puzzles.forEach(function(p) {
        if (p.container) {
          p.container.classList.toggle('selected', p === puzzle);
        }
      });
      document.getElementById('status').textContent =
        'Selected graph #' + puzzle.id + ' | ' + puzzle.status +
        ' | ' + puzzle.count + ' crossings | ' + puzzle.moves + ' moves';
    }

    function maybeAddReplacement() {
      var checkbox = document.getElementById('auto-add');
      if (!checkbox || checkbox.checked) addPuzzleBatch(1);
    }
    
    // Log solved puzzle summary
    function logSolvedPuzzle(puzzle) {
      if (!fs) return;
      
      var entry = {
        id: puzzle.id,
        status: 'solved',
        timestamp: new Date().toISOString(),
        initialCrossings: puzzle.initialCrossings,
        moves: puzzle.moves,
        strategies: strategyCounts(puzzle.history)
      };
      
      try {
        fs.appendFileSync('dashboard-results.jsonl', JSON.stringify(entry) + '\n');
      } catch(e) {}
    }
    
    // Log stuck puzzles to file for analysis
    function logStuckPuzzle(puzzle) {
      if (!fs) return;
      
      var entry = {
        id: puzzle.id,
        timestamp: new Date().toISOString(),
        initialCrossings: puzzle.initialCrossings,
        finalCrossings: puzzle.count,
        moves: puzzle.moves,
        strategies: strategyCounts(puzzle.history),
        finalDiagnostics: analyzeGraphState
          ? analyzeGraphState(puzzle.graph, puzzle.solverState || {}) : null,
        lastMoves: puzzle.history.slice(-30),
        // Save graph state for potential export to interactive
        graph: {
          nodes: graphPositions(puzzle.graph),
          edges: graphEdges(puzzle.graph)
        }
      };
      
      try {
        fs.appendFileSync('dashboard-stuck.jsonl', JSON.stringify(entry) + '\n');
        console.log('Logged stuck puzzle #' + puzzle.id + ' to dashboard-stuck.jsonl');
      } catch(e) {
        console.error('Failed to log stuck puzzle:', e);
      }
    }
    
    function renderPuzzle(puzzle) {
      var svg = puzzle.svg;
      var w = 400, h = 300;
      var graph = puzzle.graph;
      puzzle.count = intersections(graph.links);
      
      var scaleX = function(v) { return 10 + v * (w - 20); };
      var scaleY = function(v) { return 10 + v * (h - 20); };
      
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      
      graph.links.forEach(function(link) {
        var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', scaleX(link[0][0]));
        line.setAttribute('y1', scaleY(link[0][1]));
        line.setAttribute('x2', scaleX(link[1][0]));
        line.setAttribute('y2', scaleY(link[1][1]));
        line.setAttribute('stroke', link.intersection ? '#000' : '#fc0');
        line.setAttribute('stroke-width', '0.8');
        svg.appendChild(line);
      });
      
      graph.nodes.forEach(function(node, idx) {
        var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', scaleX(node[0]));
        circle.setAttribute('cy', scaleY(node[1]));
        circle.setAttribute('r', '2.5');
        circle.setAttribute('fill', node.intersection ? '#0cf' : '#fc0');
        circle.setAttribute('stroke', '#000');
        circle.setAttribute('stroke-width', '0.3');
        svg.appendChild(circle);
        
        var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', scaleX(node[0]) + 4);
        text.setAttribute('y', scaleY(node[1]) - 4);
        text.setAttribute('font-size', '6');
        text.setAttribute('fill', '#333');
        text.textContent = idx;
        svg.appendChild(text);
      });
      
      puzzle.header.className = 'puzzle-header' + (puzzle.status === 'solved' ? ' solved' : (puzzle.status === 'stuck' ? ' stuck' : ''));
      puzzle.container.className = 'puzzle' +
        (puzzle.status === 'solved' ? ' solved' :
          (puzzle.status === 'stuck' ? ' stuck' : '')) +
        (puzzle === lastClickedPuzzle ? ' selected' : '');
      if (puzzle.status === 'solved') {
        puzzle.container.style.border = '6px solid #00ff66';
        puzzle.container.style.outline = '3px solid #00ff66';
        puzzle.container.style.boxShadow = '0 0 18px rgba(0, 255, 102, 1)';
      } else if (puzzle.status === 'stuck') {
        puzzle.container.style.border = '6px solid #ff3030';
        puzzle.container.style.outline = '3px solid #ff3030';
        puzzle.container.style.boxShadow = '0 0 18px rgba(255, 48, 48, 1)';
      } else {
        puzzle.container.style.border = '4px solid #333';
        puzzle.container.style.outline = '2px solid transparent';
        puzzle.container.style.boxShadow = 'none';
      }
      if (puzzle === lastClickedPuzzle) {
        puzzle.container.style.outline = '4px solid #66ccff';
      }
      var statusInfo = puzzle.count + ' crossings | ' + puzzle.moves + ' moves';
      if (puzzle.status === 'solved') {
        statusInfo += ' (SOLVED)';
      }
      if (puzzle.status === 'stuck') {
        statusInfo += ' (STUCK @ ' + puzzle.count + ')';
      }
      function metricItem(label, value) {
        return '<span class="k">' + label + '</span>' +
          '<span class="v">' + value + '</span>';
      }
      var metricsLine = '';
      if (analyzeGraphState && computeProgressMetrics && puzzle.status !== 'solved') {
        puzzle.solverState = puzzle.solverState || {};
        var analysis = analyzeGraphState(puzzle.graph, puzzle.solverState);
        var pm = computeProgressMetrics(puzzle.graph, analysis);
        puzzle.progressMetrics = pm;
        var sep = '<span class="sep">·</span>';
        metricsLine =
          metricItem('progress', pm.progress.toFixed(3)) + sep +
          metricItem('largest-clean', Math.round(pm.largestCleanRegionRatio * 100) + '%') + sep +
          metricItem('clean-edges', Math.round(pm.cleanEdgeRatio * 100) + '%') + sep +
          metricItem('near-clean', Math.round(pm.nearCleanRatio * 100) + '%') + sep +
          metricItem('top-concentration', Math.round(pm.topCrossingShare * 100) + '%');
      } else if (puzzle.status === 'solved') {
        metricsLine = metricItem('prog', '1.000') +
          '<span class="sep">·</span>' +
          '<span class="v" style="color:#7f7">solved</span>';
      }
      // Story / cascade-state row (live, causal). Computed per-move in
      // solverStep; here we only display puzzle.storyMetrics.
      var storyLine = '';
      var sm = puzzle.storyMetrics;
      if (sm && puzzle.status !== 'solved') {
        var sep2 = '<span class="sep">·</span>';
        var trendStr = (sm.trend > 0 ? '+' : '') + sm.trend;
        storyLine =
          metricItem('freeze', sm.freeze.toFixed(2)) + sep2 +
          metricItem('dwell', sm.dwell) + sep2 +
          metricItem('crowd', sm.crowd) + sep2 +
          metricItem('trend', trendStr) + sep2 +
          metricItem('thaw', sm.thaw) + sep2 +
          metricItem('drop', sm.drop);
      }
      puzzle.header.innerHTML =
        '<div class="row"><span>' + statusInfo + '</span>' +
        '<span>' + (puzzle.lastStrategy || '-') + '</span></div>' +
        '<div class="row metrics-row"><span>' + metricsLine + '</span></div>' +
        (storyLine ? '<div class="row metrics-row"><span>' + storyLine + '</span></div>' : '');
      puzzle.header.title = 'Click puzzle to see history in console';
    }
    
    function solverStep(puzzle, callback) {
      applySolverClock(false);
      var graph = puzzle.graph;
      puzzle.count = intersections(graph.links);
      
      if (puzzle.count === 0) {
        puzzle.status = 'solved';
        if (!puzzle.counted) { 
          stats.solved++; 
          puzzle.counted = true;
          maybeAddReplacement();
        }
        renderPuzzle(puzzle);
        callback(false);
        return;
      }
      
      // Use shared solver step from solver.js
      puzzle.solverState = puzzle.solverState || {};
      var result = solverStepCore(graph, puzzle.solverState);
      
      if (result.done) {
        puzzle.status = 'solved';
        puzzle.count = 0;
        if (!puzzle.counted) { 
          stats.solved++; 
          puzzle.counted = true;
          maybeAddReplacement();
          
          // Log solved puzzle summary
          logSolvedPuzzle(puzzle);
        }
        renderPuzzle(puzzle);
        callback(false);
        return;
      }
      
      if (result.stuck) {
        puzzle.status = 'stuck';
        if (!puzzle.counted) { 
          stats.stuck++; 
          puzzle.counted = true;
          maybeAddReplacement();
          
          // Log stuck puzzle to file for analysis
          logStuckPuzzle(puzzle);
        }
        renderPuzzle(puzzle);
        callback(false);
        return;
      }
      
      if (result.move) {
        puzzle.moves++;
        puzzle.lastStrategy = result.move.strategy;
        puzzle.count = result.count;
        stats.totalMoves++;
        
        // Log move to history
        puzzle.history = puzzle.history || [];
        var moveEntry = {
          n: puzzle.moves,
          v: result.move.nodeIndex,
          x: puzzle.count,
          src: result.move.strategy,
          move: puzzle.moves,
          vertex: result.move.nodeIndex,
          strategy: result.move.strategy,
          crossings: puzzle.count,
          positions: graphPositions(puzzle.graph),
          structuralPlan: result.move.search && result.move.search.structuralPlan || null,
          search: result.move.search || null,
          from: [result.move.fromX, result.move.fromY],
          to: [result.move.toX, result.move.toY],
          improvement: result.move.improvement
        };
        puzzle.history.push(moveEntry);
        puzzle.snapshots.push(snapshotPuzzle(puzzle, 'move', result));

        // Live story/cascade-state metrics, kept on solverState so the algo can
        // read them next step. Updated once per actual move (not per render).
        if (updateStoryMetrics) {
          puzzle.solverState.storyState = puzzle.solverState.storyState || createStoryState();
          puzzle.storyMetrics = updateStoryMetrics(
            puzzle.graph, puzzle.solverState.storyState, null, puzzle.count);
        }

        renderPuzzle(puzzle);
        // Keep running as long as we made a move (escape moves may not "improve" but should continue)
        callback(true);
      } else {
        renderPuzzle(puzzle);
        callback(false);
      }
    }
    
    var puzzleIdCounter = 0;
    var puzzleRowHeight = 0;
    
    function initRowHeight() {
      var controlsHeight = document.querySelector('.controls').offsetHeight;
      var availableHeight = window.innerHeight - controlsHeight - 30; // 30 for padding/gaps
      puzzleRowHeight = Math.floor(availableHeight / 2);
      document.getElementById('grid').style.gridAutoRows = puzzleRowHeight + 'px';
    }
    
    function addPuzzleBatch(count) {
      var numNodes = parseInt(document.getElementById('num-nodes').value) || 30;
      var grid = document.getElementById('grid');
      count = count || 3;
      
      for (var i = 0; i < count; i++) {
        var div = document.createElement('div');
        div.className = 'puzzle';
        
        var header = document.createElement('div');
        header.className = 'puzzle-header';
        div.appendChild(header);

        var actions = document.createElement('div');
        actions.className = 'puzzle-actions';
        var selectBtn = document.createElement('button');
        selectBtn.textContent = 'Select';
        var replayBtn = document.createElement('button');
        replayBtn.textContent = 'Replay';
        var jsonBtn = document.createElement('button');
        jsonBtn.textContent = 'JSON';
        actions.appendChild(selectBtn);
        actions.appendChild(replayBtn);
        actions.appendChild(jsonBtn);
        div.appendChild(actions);
        
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 400 300');
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        div.appendChild(svg);
        
        grid.appendChild(div);
        
        var puzzle = {
          id: puzzleIdCounter++,
          graph: scramble(planarGraph(numNodes)),
          svg: svg,
          header: header,
          container: div,
          count: 0,
          moves: 0,
          status: 'running',
          lastStrategy: null,
          stuckCount: 0,
          counted: false,
          history: [],
          snapshots: []
        };
        puzzles.push(puzzle);
        puzzle.count = intersections(puzzle.graph.links);
        puzzle.initialCrossings = puzzle.count;
        puzzle.edges = graphEdges(puzzle.graph);
        puzzle.snapshots.push(snapshotPuzzle(puzzle, 'initial', null));
        
        // Click to show history (use IIFE to capture puzzle correctly)
        (function(p) {
          div.addEventListener('click', function() {
            selectPuzzle(p);
            console.log('=== Puzzle #' + p.id + ' ===');
            console.log('Status:', p.status);
            console.log('Initial crossings:', p.initialCrossings);
            console.log('Final crossings:', p.count);
            console.log('Moves:', p.moves);
            console.log('History (last 20):');
            var hist = p.history.slice(-20);
            hist.forEach(function(h) {
              console.log('  Move ' + h.n + ': v' + h.v + ' -> ' + h.x + ' crossings (' + h.src + ')');
            });
            // Strategy breakdown
            var strats = {};
            p.history.forEach(function(h) {
              strats[h.src] = (strats[h.src] || 0) + 1;
            });
            console.log('Strategy breakdown:', strats);
            // Make history available globally for analysis
            console.log('Full history in window.lastPuzzleHistory, puzzle in window.lastPuzzle');
          });
          selectBtn.addEventListener('click', function(event) {
            event.stopPropagation();
            selectPuzzle(p);
          });
          replayBtn.addEventListener('click', function(event) {
            event.stopPropagation();
            selectPuzzle(p);
            exportPuzzleReplay(p);
          });
          jsonBtn.addEventListener('click', function(event) {
            event.stopPropagation();
            selectPuzzle(p);
            exportPuzzleJson(p);
          });
        })(puzzle);
        
        renderPuzzle(puzzle);
      }
      updateStatus();
      // Scroll to show new puzzles
      setTimeout(function() { window.scrollTo(0, document.body.scrollHeight); }, 50);
    }
    
    function createPuzzles() {
      applySolverClock(true);
      var grid = document.getElementById('grid');
      grid.innerHTML = '';
      puzzles = [];
      puzzleIdCounter = 0;
      stats = { solved: 0, stuck: 0, totalMoves: 0 };
      addPuzzleBatch(6);
    }
    
    function updateStatus() {
      var active = puzzles.filter(function(p) { return p.status === 'running'; }).length;
      document.getElementById('status').textContent = 
        'Solved: ' + stats.solved + ' | Stuck: ' + stats.stuck + ' | Active: ' + active + ' | Total: ' + puzzles.length + ' | Moves: ' + stats.totalMoves;
    }
    
    function stepAll(callback) {
      var toStep = puzzles.filter(function(p) { return p.status === 'running'; });
      var idx = 0;
      
      function next() {
        if (idx >= toStep.length) {
          updateStatus();
          var stillActive = puzzles.filter(function(p) { return p.status === 'running'; }).length;
          callback(stillActive > 0);
          return;
        }
        solverStep(toStep[idx], function() {
          idx++;
          next();
        });
      }
      next();
    }
    
    // Dump all puzzles to file when stopped
    function dumpAllPuzzles() {
      if (!fs) return;
      downloadJson('dashboard-dump.json', buildExportReport(), true);
      console.log('Dumped all puzzle info to dashboard-dump.json');
    }

    function puzzleExportSummary(p) {
      return {
        id: p.id,
        status: p.status,
        initialCrossings: p.initialCrossings,
        finalCrossings: p.count,
        moves: p.moves,
        strategies: strategyCounts(p.history),
        edges: p.edges || graphEdges(p.graph),
        initialSnapshot: p.snapshots[0] || null,
        finalSnapshot: snapshotPuzzle(p, 'final-' + p.status, null),
        finalDiagnostics: analyzeGraphState
          ? analyzeGraphState(p.graph, p.solverState || {}) : null,
        snapshots: p.snapshots,
        history: p.history
      };
    }

    function buildExportReport() {
      return {
        schemaVersion: 1,
        timestamp: new Date().toISOString(),
        session: 'solver-dashboard',
        config: {
          deterministicClock: Boolean(
            document.getElementById('deterministic-clock') &&
            document.getElementById('deterministic-clock').checked)
        },
        stats: stats,
        puzzles: puzzles.map(puzzleExportSummary)
      };
    }

    function buildInteractiveReplay(puzzle) {
      var replaySnapshots = puzzle.snapshots.slice();
      replaySnapshots.push(snapshotPuzzle(puzzle, 'final-' + puzzle.status, null));

      return {
        schemaVersion: 2,
        timestamp: new Date().toISOString(),
        session: 'solver-' + puzzle.id,
        config: {
          deterministicClock: Boolean(
            document.getElementById('deterministic-clock') &&
            document.getElementById('deterministic-clock').checked)
        },
        nodes: graphPositions(puzzle.graph),
        edges: puzzle.edges || graphEdges(puzzle.graph),
        currentPosition: Math.max(0, replaySnapshots.length - 1),
        moves: puzzle.moves,
        selectedVertex: -1,
        crossings: puzzle.count,
        history: replaySnapshots.map(function(item) {
          return {
            positions: item.positions,
            crossings: item.crossings,
            strategy: item.strategy || item.label,
            movingNode: item.movingNode,
            move: item.moveRecord || {
              source: 'solver',
              strategy: item.label,
              vertex: item.movingNode,
              number: item.moveNumber
            }
          };
        })
      };
    }

    function exportAllPuzzles(automatic) {
      downloadJson('solver-results.json', buildExportReport(), automatic);
    }

    function exportPuzzleReplay(puzzle) {
      downloadJson(
        'solver-graph-' + puzzle.id + '-replay.json',
        buildInteractiveReplay(puzzle),
        false);
    }

    function exportPuzzleJson(puzzle) {
      downloadJson(
        'solver-graph-' + puzzle.id + '.json',
        puzzleExportSummary(puzzle),
        false);
    }

    function exportLastClickedReplay() {
      if (!lastClickedPuzzle) {
        document.getElementById('status').textContent += ' | Click a puzzle first';
        return;
      }
      exportPuzzleReplay(lastClickedPuzzle);
    }
    
    function start() {
      if (running) {
        running = false;
        document.getElementById('start-btn').textContent = 'Start';
        dumpAllPuzzles();
        return;
      }
      running = true;
      applySolverClock(true);
      document.getElementById('start-btn').textContent = 'Stop';
      
      function tick() {
        if (!running) return;
        var speed = parseInt(document.getElementById('speed').value);
        var delay = Math.max(5, 150 - speed);
        
        stepAll(function(anyActive) {
          if (anyActive && running) {
            setTimeout(tick, delay);
          } else {
            running = false;
            document.getElementById('start-btn').textContent = 'Start';
          }
        });
      }
      tick();
    }
    
    document.getElementById('start-btn').addEventListener('click', start);
    document.getElementById('add-btn').addEventListener('click', function() { addPuzzleBatch(6); });
    document.getElementById('reset-btn').addEventListener('click', createPuzzles);
    document.getElementById('export-btn').addEventListener('click', function() {
      exportAllPuzzles(false);
    });
    document.getElementById('export-replay-btn').addEventListener('click', exportLastClickedReplay);
    
    initRowHeight();
    createPuzzles();
  </script>
</body>
</html>
